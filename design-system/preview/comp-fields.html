<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .lbl{font-family:var(--s3-sans);font-size:11.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--s3-muted);display:block;margin-bottom:8px;}
  .inp{width:100%;font-family:var(--s3-sans);font-size:16px;color:var(--s3-ink);background:var(--s3-bg);border:1.5px solid var(--s3-rule);border-radius:12px;padding:13px 16px;outline:none;}
</style></head>
<body><div class="wrap">
  <div style="background:var(--s3-card);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:18px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
      <div><label class="lbl">Name</label><input class="inp" value="Steven Green"></div>
      <div><label class="lbl" style="color:var(--s3-forest);">Email (focus)</label><input class="inp" value="email@stevengreen.com.au" style="border-color:var(--s3-forest);"></div>
    </div>
    <div><label class="lbl">Question to pressure-test</label><div class="inp" style="color:var(--s3-hush);min-height:54px;">Where does the binding constraint sit before next vintage?</div></div>
  </div>
</div></body></html>

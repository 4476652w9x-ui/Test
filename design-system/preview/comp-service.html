<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row{display:grid;grid-template-columns:minmax(150px,0.7fr) 1.3fr auto;gap:10px 28px;padding:20px 0;align-items:baseline;border-top:1px solid var(--s3-rule);}
  .row:last-child{border-bottom:1px solid var(--s3-rule);}
  .row h3{font-family:var(--s3-display);font-weight:700;font-size:22px;letter-spacing:-0.02em;color:var(--s3-forest);margin:0;}
  .row p{font-family:var(--s3-sans);font-size:14px;line-height:1.5;color:var(--s3-muted);margin:0;}
  .circ{width:42px;height:42px;border-radius:999px;background:var(--s3-card);color:var(--s3-forest);display:inline-flex;align-items:center;justify-content:center;font-size:17px;justify-self:end;}
</style></head>
<body><div class="wrap">
  <div class="cap">Service rows</div>
  <div class="row"><h3>Monthly retainer</h3><p>Ongoing fractional CFO on a defined cadence.</p><span class="circ">↗</span></div>
  <div class="row"><h3>Project &amp; transaction</h3><p>Defined scope, defined exit. M&amp;A, capital-raise prep.</p><span class="circ">↗</span></div>
</div></body></html>

<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <div style="display:flex;gap:18px;">
    <div style="flex:1;background:var(--s3-card);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px;">
      <span style="font-family:var(--s3-sans);font-weight:600;font-size:12.5px;letter-spacing:0.05em;color:var(--s3-sage);">01</span>
      <h3 style="font-family:var(--s3-display);font-weight:700;font-size:20px;letter-spacing:-0.015em;color:var(--s3-forest);margin:0;line-height:1.2;">A 13-week cashflow model.</h3>
      <p style="font-family:var(--s3-sans);font-size:15px;line-height:1.55;color:var(--s3-muted);margin:0;">Anchored to the vintage cycle, built from your own ledger data.</p>
    </div>
    <div style="flex:1;background:var(--s3-forest);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:12px;">
      <span style="font-family:var(--s3-sans);font-weight:600;font-size:12.5px;letter-spacing:0.05em;color:var(--s3-sage-2);">02</span>
      <h3 style="font-family:var(--s3-display);font-weight:700;font-size:20px;letter-spacing:-0.015em;color:#fff;margin:0;line-height:1.2;">A top-down cost model.</h3>
      <p style="font-family:var(--s3-sans);font-size:15px;line-height:1.55;color:var(--s3-on-forest-muted);margin:0;">Cuts by vintage, varietal and channel — reconciled to your P&amp;L.</p>
    </div>
  </div>
  <div style="font-family:var(--s3-sans);font-size:11.5px;color:var(--s3-muted);margin-top:14px;">24px radius · light + forest variants · hover shifts surface and lifts 2px.</div>
</div></body></html>

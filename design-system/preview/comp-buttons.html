<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn{font-family:var(--s3-sans);font-weight:600;font-size:14.5px;border-radius:999px;padding:11px 22px;border:1.5px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .primary{background:#2E4034;color:#fff;}
  .ghost{background:transparent;color:#2E4034;border-color:#2E4034;}
  .link{font-family:var(--s3-sans);font-weight:600;font-size:14.5px;color:#2E4034;border-bottom:1.5px solid #2E4034;padding-bottom:1px;display:inline-flex;gap:6px;align-items:center;}
</style></head>
<body><div class="wrap">
  <div class="cap">Buttons</div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
    <button class="btn primary">Express interest <span>↗</span></button>
    <button class="btn ghost">LinkedIn <span>↗</span></button>
    <a class="link">Download CV <span>↓</span></a>
  </div>
  <div style="font-family:var(--s3-sans);font-size:11.5px;color:var(--s3-muted);margin-top:18px;">Pill (forest) · ghost outline · text link (underline). Hover deepens forest + lifts 1px; arrow nudges ↗.</div>
</div></body></html>

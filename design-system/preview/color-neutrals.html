<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <div class="cap">Neutrals, surfaces &amp; text</div>
  <div class="swatch-row" style="border-radius:14px;overflow:hidden;border:1px solid var(--s3-rule);">
    <div class="sw" style="background:#FFFFFF;color:#2E4034;"><span class="nm">BG</span><span class="hex">#FFFFFF</span></div>
    <div class="sw" style="background:#F7F8F5;color:#2E4034;"><span class="nm">Card</span><span class="hex">#F7F8F5</span></div>
    <div class="sw" style="background:#F1F3EE;color:#2E4034;"><span class="nm">Card 2</span><span class="hex">#F1F3EE</span></div>
    <div class="sw" style="background:#E5E8E3;color:#2E4034;"><span class="nm">Rule</span><span class="hex">#E5E8E3</span></div>
    <div class="sw" style="background:#6B7570;color:#fff;"><span class="nm">Muted</span><span class="hex">#6B7570</span></div>
    <div class="sw" style="background:#A8B2AC;color:#16201a;"><span class="nm">Hush</span><span class="hex">#A8B2AC</span></div>
    <div class="sw" style="background:#0E1410;color:#fff;"><span class="nm">Ink</span><span class="hex">#0E1410</span></div>
  </div>
</div></body></html>
